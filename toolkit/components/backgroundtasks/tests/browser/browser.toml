[DEFAULT]
head = "head.js"

["browser_backgroundtask_specific_pref.js"]
run-if = [
  "appname == 'firefox'", # Prefs are Firefox specific, e.g. not Thunderbird
]

["browser_xpcom_graph_wait.js"]
skip-if = [
  "enterprise", # Bug 2065847: disable test in enterprise builds
  "tsan", # TSan times out on pretty much all profiler-consuming tests.
]
