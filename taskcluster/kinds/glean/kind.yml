---
loader: taskgraph.loader.transform:loader

transforms:
    - gecko_taskgraph.transforms.job:transforms
    - gecko_taskgraph.transforms.task:transforms

kind-dependencies:
    - toolchain
    - fetch

tasks:
    export:
        description: >-
            Export a static JSON snapshot of all Firefox Glean metric and ping
            definitions. The resulting glean-probes.json is a shippable
            alternative to the probe-scraper API, consumed by the
            `moa generate release` tool.
        run-on-projects: ["enterprise-firefox"]
        run-on-repo-type: ["git"]
        worker-type: b-linux
        worker:
            docker-image: {in-tree: "lint"}
            max-run-time: 1800
            artifacts:
                - type: file
                  name: public/glean-probes.json
                  path: /builds/worker/artifacts/glean-probes.json
        run:
            using: mach
            mach: "glean export --output-file /builds/worker/artifacts/glean-probes.json"
            use-caches: [checkout, pip, uv]
        attributes:
            shippable: true
        shipping-phase: build
        shipping-product: firefox-enterprise
        index:
            product: firefox
            job-name: glean-export
            type: shippable
        treeherder:
            symbol: Glean(export)
            kind: build
            platform: linux64/opt
            tier: 1
