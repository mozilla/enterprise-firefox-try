name: Try status
on:
  pull_request_target:
    types: [opened, reopened, synchronize]

  # ITERATION ONLY, drop before landing. pull_request_target runs the copy of
  # this file and of the action that lives on the PR's base branch, so edits to
  # either are invisible until they land there. pull_request runs the copy from
  # the PR itself, which makes the loop editable. Keeping both once landed would
  # have two runs racing to write the same status contexts.
  pull_request:
    types: [opened, reopened, synchronize]

  # Try pushes outlive the workflow run that reports on them, so allow asking
  # for a refreshed status.
  workflow_dispatch:
    inputs:
      pull_request:
        description: Pull request number to refresh the try status of.
        required: true

permissions:
  contents: read
  # Only needed to resolve a PR number to its branch on workflow_dispatch.
  pull-requests: read
  statuses: write

concurrency:
  # The event name is part of the group so that the pull_request_target run and
  # the pull_request one do not cancel each other while both triggers exist.
  group: try-status-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.inputs.pull_request }}
  cancel-in-progress: true

env:
  GH_REPO: ${{ github.repository }}
  GH_TOKEN: ${{ github.token }}

jobs:
  try-status:
    name: Try status
    if: github.repository == 'mozilla/enterprise-firefox' || github.repository == 'lissyx/enterprise-firefox'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Resolve the pull request
        id: pr
        env:
          PR: ${{ github.event.pull_request.number || github.event.inputs.pull_request }}
          EVENT_BRANCH: ${{ github.event.pull_request.head.ref }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ -n "${EVENT_BRANCH}" ]]; then
            branch="${EVENT_BRANCH}"
            head_sha="${EVENT_HEAD_SHA}"
          else
            branch=$(gh pr view "${PR}" --json headRefName --jq '.headRefName')
            head_sha=$(gh pr view "${PR}" --json headRefOid --jq '.headRefOid')
          fi
          {
            echo "pr=${PR}"
            echo "branch=${branch}"
            echo "head_sha=${head_sha}"
          } >>"${GITHUB_OUTPUT}"

      - name: Check out the try status action
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github/actions/enterprise-try-action
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Collect and publish the try status
        id: try
        uses: ./.github/actions/enterprise-try-action
        with:
          branch: ${{ steps.pr.outputs.branch }}
          # A try push made right before or after the PR push takes a moment to
          # show up on Treeherder. Lower this if the wait is not worth it.
          wait-for-push: 600
          poll-interval: 60
          # Keep polling until every job of the push has completed, publishing
          # each result as it lands. GitHub kills a job at six hours, so stop
          # just under that and leave room for the wait above.
          poll-timeout: 20400
          head-sha: ${{ steps.pr.outputs.head_sha }}
          github-token: ${{ github.token }}
