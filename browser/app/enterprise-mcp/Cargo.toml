[package]
name = "firefox-enterprise-mcp"
version = "0.1.0"
edition = "2021"
license = "MPL-2.0"

[[bin]]
name = "firefox-enterprise-mcp"
path = "src/main.rs"

[dependencies]
libc = "0.2"
mozilla-central-workspace-hack = { version = "0.1", features = ["firefox-enterprise-mcp"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nserror = { path = "../../../xpcom/rust/nserror", optional = true }
nsstring = { path = "../../../xpcom/rust/nsstring", optional = true }
xpcom = { path = "../../../xpcom/rust/xpcom", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

[features]
gecko = ["dep:nserror", "dep:nsstring", "dep:xpcom"]
