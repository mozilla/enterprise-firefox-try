# Adding a new metric? We have docs for that!
# https://firefox-source-docs.mozilla.org/toolkit/components/glean/user/new_definitions_file.html

---
$schema: moz://mozilla.org/schemas/glean/metrics/2-0-0
$tags:
  - 'Enterprise Products :: Firefox'

access_connector:
  proxy_error:
    type: event
    description: >
      Recorded when the Access Connector proxy error state is shown to the
      user (urlbar button enters error state due to a proxy connection failure).
      Only collected when MOZ_ENTERPRISE is defined and enabled.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_sensitivity:
      - highly_sensitive
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      domain:
        description: >
          The hostname of the site that failed to load through the Access
          Connector proxy.
        type: string

enterprise_mcp:
  operation:
    type: event
    data_sensitivity:
      - highly_sensitive
    description: >
      Records whether Firefox Enterprise authorized a local MCP operation.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      session:
        description: Random identifier for this browser connection.
        type: string
      client_identity:
        description: The verified key or application identifier configured by the administrator.
        type: string
      category:
        description: The policy grant checked, or Discovery for list_tabs.
        type: string
      operation:
        description: The operation requested by the connector.
        type: string
      origin:
        description: The hostname or HTTP(S) origin involved, when enabled by policy and known.
        type: string
      decision:
        description: Whether the browser allowed or denied the operation.
        type: string
  session_event:
    type: event
    data_sensitivity:
      - highly_sensitive
    description: >-
      Records local MCP admission decisions and when a user stops an MCP session.
    bugs:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    data_reviews:
      - https://bugzilla.mozilla.org/show_bug.cgi?id=TBD
    notification_emails:
      - security-telemetry@mozilla.org
      - enterprise-telemetry@mozilla.org
    expires: never
    send_in_pings:
      - enterprise
    extra_keys:
      session:
        description: Random identifier for this browser connection.
        type: string
      client_identity:
        description: The verified key or application identifier configured by the administrator.
        type: string
      access_mode:
        description: The administrator-configured MCP client access mode.
        type: string
      action:
        description: Whether the connection was admitted, rejected, or stopped by the user.
        type: string
